<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ff6b8a">
  <title>הפרופיל שלי — סטייל מתגלגל</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="logo" style="flex:1">הפרופיל שלי</div>
  <button class="icon-btn" id="logoutBtn" title="התנתקות">🚪</button>
</header>

<main class="container">
  <div id="profile"></div>

  <div id="pushCard" style="background:white; border-radius:14px; padding:14px 16px; margin-top:14px; display:none; align-items:center; gap:12px; box-shadow:var(--shadow)">
    <div style="width:42px;height:42px;border-radius:10px;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">🔔</div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:14px" id="pushTitle">התראות</div>
      <div class="text-muted" style="font-size:12px" id="pushDesc">קבלי התראה על פריטים חדשים</div>
    </div>
    <label class="switch" style="position:relative;width:48px;height:28px;flex-shrink:0">
      <input type="checkbox" id="pushToggle" style="opacity:0;width:0;height:0">
      <span style="position:absolute;inset:0;background:#ccc;border-radius:28px;transition:.2s;cursor:pointer" id="pushSlider"></span>
    </label>
  </div>

  <h3 style="margin: 24px 0 12px">הפריטים שלי</h3>
  <div id="grid" class="grid"></div>

  <style>
    #pushSlider::before {
      content: "";
      position: absolute;
      top: 3px; right: 3px;
      width: 22px; height: 22px;
      background: white; border-radius: 50%;
      transition: .2s;
    }
    #pushToggle:checked + #pushSlider { background: var(--pink); }
    #pushToggle:checked + #pushSlider::before { right: 23px; }
  </style>
  <div id="empty" class="empty" style="display:none">
    <div class="emoji">🛍️</div>
    <h3>עוד לא העלית פריטים</h3>
    <a href="/upload.html" class="btn" style="display:inline-block; margin-top:12px">+ העלאת פריט</a>
  </div>
</main>

<script src="/firebase-auth.js"></script>
<script src="/app.js"></script>
<script>
if (!Auth.isLoggedIn()) {
  showLoginModal((u) => location.reload());
}

async function load() {
  const u = Auth.user();
  if (!u) return;

  document.getElementById("profile").innerHTML = `
    <div class="seller-card">
      <div class="seller-avatar">${u.name.charAt(0)}</div>
      <div style="flex:1">
        <div style="font-weight:700; font-size:18px">${u.name}</div>
        <div class="text-muted">📱 ${u.phone}</div>
      </div>
    </div>
  `;

  try {
    const res = await api("/api/me/items");
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    if (res.items.length === 0) {
      empty.style.display = "block";
    } else {
      grid.innerHTML = res.items.map(itemCard).join("");
    }
  } catch (err) { toast(err.message); }
}

document.getElementById("logoutBtn").onclick = async () => {
  if (!confirm("להתנתק?")) return;
  try { await api("/api/auth/logout", { method: "POST" }); } catch {}
  Auth.clear();
  location.href = "/";
};

// Push notifications toggle
(async () => {
  if (!Push.supported()) return;
  const card = document.getElementById("pushCard");
  const toggle = document.getElementById("pushToggle");
  const desc = document.getElementById("pushDesc");

  card.style.display = "flex";
  const enabled = await Push.isEnabled();
  toggle.checked = enabled;
  desc.textContent = enabled
    ? "מופעל — תקבלי התראה על פריטים חדשים"
    : "קבלי התראה על פריטים חדשים";

  toggle.addEventListener("change", async () => {
    toggle.disabled = true;
    try {
      if (toggle.checked) {
        await Push.enable();
        desc.textContent = "מופעל — תקבלי התראה על פריטים חדשים";
        toast("התראות הופעלו 🔔");
      } else {
        await Push.disable();
        desc.textContent = "התראות כבויות";
        toast("התראות כובו");
      }
    } catch (e) {
      toggle.checked = !toggle.checked;
      toast(e.message);
    } finally {
      toggle.disabled = false;
    }
  });
})();

renderBottomNav("profile");
load();
</script>
</body>
</html>
